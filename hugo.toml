baseURL = 'https://o-sakurajimamai-o.github.io/'
title = 'Sakura'

defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false

[languages]
    [languages.en]
        languageName = 'EN'
        languageCode = 'en-us'
        weight = 1
        title = 'Mai'
        [languages.en.params]
            description = 'Notes on Agents and things I find interesting'
            intro = """Hi, 
            I'm a postgraduate student in CS at TianJin University; 
            This blog is where I document my learning journey."""

    [languages.zh]
        languageName = '中文'
        languageCode = 'zh-CN'
        weight = 2
        title = '麻衣'
        [languages.zh.params]
            description = '关于Agent和一些有意思的东西'
            intro = '''欢迎，
            本人是一名天津大学计算机技术在读研究生，
            此博客用于记录学习经历。'''


[markup.goldmark.renderer]
    unsafe = true

[markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
        block  = [['\[', '\]'], ['$$', '$$']]
        inline = [['\(', '\)'], ['$', '$']]

[markup.highlight]
    noClasses = false
    lineNos = false

[markup.tableOfContents]
    startLevel = 2
    endLevel   = 3
    ordered    = false

[params]
    author = 'Sakura'
    github = 'https://github.com/o-Sakurajimamai-o'

# 评论区（giscus）。categoryId 填上之后评论区才会出现，留空则整块不渲染。
# repo / repoId 已按你的仓库填好，不用动。
[params.giscus]
    repo          = 'o-Sakurajimamai-o/o-Sakurajimamai-o.github.io'
    repoId        = 'R_kgDOUFEZEA'
    category      = 'Comments'
    categoryId    = 'DIC_kwDOUFEZEM4DESCq'
    # 'specific' = 中英文两个版本共用一条讨论帖（term 自动取文件夹名 blog1）
    # 想让中英文各自独立成帖，把这里改成 'pathname'
    mapping       = 'specific'
    inputPosition = 'top'