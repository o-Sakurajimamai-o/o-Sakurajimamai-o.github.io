<script>
(function () {
    var toc = document.querySelector('.toc');
    if (!toc) return;

    var links = [].slice.call(toc.querySelectorAll('a[href^="#"]'));
    var targets = links.map(function (a) {
        return { link: a, el: document.getElementById(decodeURIComponent(a.getAttribute('href').slice(1))) };
    }).filter(function (t) { return t.el; });
    var targets = links.map(function (a) {
        return { link: a, el: document.getElementById(decodeURIComponent(a.getAttribute('href').slice(1))) };
    }).filter(function (t) { return t.el; });
    if (!targets.length) return;

    var current = null, ticking = false;

    function update() {
        ticking = false;

        var line = 140;                    // 激活线：视口顶部往下 140px
        var active = targets[0];
        for (var i = 0; i < targets.length; i++) {
        if (targets[i].el.getBoundingClientRect().top <= line) active = targets[i];
        else break;
        }

        // 滚到页面底部时，强制高亮最后一节
        if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) {
        active = targets[targets.length - 1];
        }

        if (active === current) return;
        if (current) current.link.classList.remove('active');
        active.link.classList.add('active');
        current = active;

        // 目录很长时，把当前项滚进可视范围
        var lr = active.link.getBoundingClientRect(), tr = toc.getBoundingClientRect();
        if (lr.top < tr.top || lr.bottom > tr.bottom) {
        toc.scrollTop += lr.top - tr.top - tr.height / 3;
        }
    }

    function onScroll() {
        if (!ticking) { ticking = true; requestAnimationFrame(update); }
    }

    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll);
    update();
})();
</script>
