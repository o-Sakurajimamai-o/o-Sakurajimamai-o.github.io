<button id="theme-toggle" type="button" aria-label="Toggle theme"
        class="opacity-60 hover:opacity-100 transition-opacity">
    <svg id="icon-sun" class="w-5 h-5 hidden dark:block" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
    </svg>
    <svg id="icon-moon" class="w-5 h-5 block dark:hidden" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
    </svg>
</button>

<script>
    (function () {
        var btn = document.getElementById('theme-toggle');
        var root = document.documentElement;

        function syncHighlight() {
        var dark = root.classList.contains('dark');
        var l = document.getElementById('hl-light');
        var d = document.getElementById('hl-dark');
        if (l) l.disabled = dark;
        if (d) d.disabled = !dark;
        }
        syncHighlight();

        btn.addEventListener('click', function () {
        root.classList.toggle('dark');
        localStorage.setItem('theme', root.classList.contains('dark') ? 'dark' : 'light');
        syncHighlight();
        if (window.__syncGiscusTheme) window.__syncGiscusTheme();   // 评论区联动，下面会用到
        });
    })();
</script>
