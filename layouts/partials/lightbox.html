<div class="lightbox" id="lightbox"><img alt=""></div>

<script>
(function () {
  var imgs = document.querySelectorAll('.prose img');
  if (!imgs.length) return;

  var box  = document.getElementById('lightbox');
  var full = box.querySelector('img');
  var prevOverflow = '', prevPad = '';

  function open(src, alt) {
    full.src = src;
    full.alt = alt || '';
    box.classList.add('open');
    // 锁定背景滚动，并补上滚动条消失导致的宽度跳动。
    // 先存原值，避免和目录抽屉的同类设置互相覆盖。
    prevOverflow = document.body.style.overflow;
    prevPad = document.body.style.paddingRight;
    var sw = window.innerWidth - document.documentElement.clientWidth;
    document.body.style.overflow = 'hidden';
    if (sw > 0) document.body.style.paddingRight = sw + 'px';
  }

  function close() {
    box.classList.remove('open');
    document.body.style.overflow = prevOverflow;
    document.body.style.paddingRight = prevPad;
  }

  [].forEach.call(imgs, function (img) {
    if (img.closest('a')) return;            // 图片本身是链接，别抢它的点击
    img.classList.add('zoomable');
    img.addEventListener('click', function () {
      open(img.currentSrc || img.src, img.alt);
    });
  });

  // 点在图片以外的任何地方 → 关闭
  box.addEventListener('click', function (e) {
    if (e.target !== full) close();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && box.classList.contains('open')) close();
  });
})();
</script>
