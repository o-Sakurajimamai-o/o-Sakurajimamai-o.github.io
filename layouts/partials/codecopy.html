<script>
(function () {
  var pres = document.querySelectorAll('.prose pre');
  // clipboard API 只在 https / localhost 下有；拿不到就干脆不放按钮，
  // 免得点了没反应。
  if (!pres.length || !navigator.clipboard) return;

  // Go 模板在 JS 上下文里会自动补引号并转义，不要再 jsonify。
  var LABEL  = {{ i18n "copy" }};
  var DONE_L = {{ i18n "copied" }};

  var ICON_COPY =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"' +
    ' stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<rect x="9" y="9" width="13" height="13" rx="2"/>' +
    '<path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';

  var ICON_DONE =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"' +
    ' stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M20 6 9 17l-5-5"/></svg>';

  [].forEach.call(pres, function (pre) {
    var box = pre.parentElement;
    // Chroma 的围栏代码块外面已经有 .highlight，直接拿它当定位父级；
    // 缩进式代码块是光秃秃的 <pre>，补包一层。
    if (!box.classList.contains('highlight')) {
      box = document.createElement('div');
      pre.parentNode.insertBefore(box, pre);
      box.appendChild(pre);
    }
    box.classList.add('code-box');

    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'code-copy';
    btn.title = LABEL;
    btn.setAttribute('aria-label', LABEL);
    btn.innerHTML = ICON_COPY;
    box.appendChild(btn);

    var timer;
    btn.addEventListener('click', function () {
      var code = pre.querySelector('code') || pre;
      // 用 textContent 而不是 innerText：Chroma 给每行套了 display:flex 的
      // .line，innerText 会按渲染结果补出多余空行。
      var text = code.textContent.replace(/\n+$/, '');

      navigator.clipboard.writeText(text).then(function () {
        btn.innerHTML = ICON_DONE;
        btn.title = DONE_L;
        btn.setAttribute('aria-label', DONE_L);
        btn.classList.add('is-done');

        clearTimeout(timer);
        timer = setTimeout(function () {
          btn.innerHTML = ICON_COPY;
          btn.title = LABEL;
          btn.setAttribute('aria-label', LABEL);
          btn.classList.remove('is-done');
        }, 1600);
      });
    });
  });
})();
</script>
