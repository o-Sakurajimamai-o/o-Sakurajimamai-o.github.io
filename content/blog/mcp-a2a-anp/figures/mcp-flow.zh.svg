<svg xmlns="http://www.w3.org/2000/svg" width="720" height="962" viewBox="0 0 720 962" role="img" aria-labelledby="title desc" xml:lang="zh">
<title id="title">MCP 应用、客户端与服务器的关系</title>
<desc id="desc">Host 中包含 LLM 与 MCP Client，应用内部协调二者。MCP Client 通过 MCP 标准协议与 MCP Server 双向通信。服务器提供 tools、resources、prompts，并对接业务 API 或数据源。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 z" fill="#678097"/></marker>
<marker id="arrowStart" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 9 1 L 1 5 L 9 9 z" fill="#678097"/></marker>
</defs>
<rect width="720" height="962" rx="24" fill="#ffffff"/>
<g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
<text x="360" y="54" font-size="30" text-anchor="middle" font-weight="700" fill="#203348">MCP：把能力接入应用</text>
<text x="360" y="92" font-size="20" text-anchor="middle" font-weight="400" fill="#5b6e80">Host 组织模型与客户端，服务器提供能力</text>
<rect x="52" y="134" width="616" height="288" rx="18" fill="#eef5ff" stroke="#bcd4f6" stroke-width="2"/>
<text x="80" y="173" font-size="24" text-anchor="start" font-weight="650" fill="#203348">Host · AI 应用</text>
<rect x="160" y="199" width="400" height="76" rx="18" fill="#f8fafc" stroke="#d5dee7" stroke-width="2"/>
<text x="360" y="232" font-size="25" text-anchor="middle" font-weight="650" fill="#203348">LLM</text>
<text x="360" y="258" font-size="18" text-anchor="middle" font-weight="400" fill="#526476">理解任务，生成调用意图</text>
<path d="M 360 282 L 360 316" fill="none" stroke="#678097" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="392" y="307" font-size="18" text-anchor="start" font-weight="400" fill="#526476">应用内部协调</text>
<rect x="160" y="326" width="400" height="70" rx="18" fill="#eef5ff" stroke="#bcd4f6" stroke-width="2"/>
<text x="360" y="369" font-size="25" text-anchor="middle" font-weight="650" fill="#203348">MCP Client</text>
<path d="M 360 438 L 360 508" fill="none" stroke="#678097" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrowStart)"/>
<text x="395" y="481" font-size="21" text-anchor="start" font-weight="600" fill="#2563a6">MCP 标准协议</text>
<rect x="52" y="522" width="616" height="168" rx="18" fill="#edf9f7" stroke="#b8ddd7" stroke-width="2"/>
<text x="360" y="567" font-size="27" text-anchor="middle" font-weight="650" fill="#203348">MCP Server</text>
<rect x="82" y="600" width="176" height="48" rx="12" fill="#f8fafc" stroke="#d5dee7" stroke-width="2"/>
<text x="170" y="631" font-size="21" text-anchor="middle" font-weight="600" fill="#203348">tools</text>
<rect x="271" y="600" width="176" height="48" rx="12" fill="#f8fafc" stroke="#d5dee7" stroke-width="2"/>
<text x="359" y="631" font-size="21" text-anchor="middle" font-weight="600" fill="#203348">resources</text>
<rect x="460" y="600" width="176" height="48" rx="12" fill="#f8fafc" stroke="#d5dee7" stroke-width="2"/>
<text x="548" y="631" font-size="21" text-anchor="middle" font-weight="600" fill="#203348">prompts</text>
<path d="M 360 706 L 360 774" fill="none" stroke="#678097" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrowStart)"/>
<text x="395" y="747" font-size="20" text-anchor="start" font-weight="400" fill="#526476">服务端对接</text>
<rect x="136" y="788" width="448" height="90" rx="18" fill="#f8fafc" stroke="#d5dee7" stroke-width="2"/>
<text x="360" y="826" font-size="24" text-anchor="middle" font-weight="650" fill="#203348">业务 API / 数据源</text>
<text x="360" y="854" font-size="18" text-anchor="middle" font-weight="400" fill="#526476">数据库、检索、外部服务等</text>
<text x="360" y="928" font-size="19" text-anchor="middle" font-weight="500" fill="#526476">Host 包含 MCP Client；两者不是同一概念。</text>
</g>
</svg>
